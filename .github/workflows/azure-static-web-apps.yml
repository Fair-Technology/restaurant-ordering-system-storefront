# Builds the app once and deploys that same build output:
#   push to main -> typecheck, Playwright tests, build, deploy to the dev Static Web App
#   pull request -> the same, into a temporary preview environment
# Production is never built here: see promote.yml.

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  NODE_VERSION: '24'
  ARTIFACT_NAME: dist-${{ github.sha }}

concurrency:
  group: swa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: Typecheck and Playwright tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Install the api/ Function deps
        run: npm ci --prefix api
      - name: Unit-test the api/ Function (shop shell + route invariants)
        run: npm test --prefix api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Build the artifact
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_STRIPE_PUBLIC_KEY: ${{ vars.VITE_STRIPE_PUBLIC_KEY }}
        run: npm run build
      - name: Copy staticwebapp.config.json into the build output
        run: cp staticwebapp.config.json dist/staticwebapp.config.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          retention-days: 90

  deploy_dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Deploy to dev
    environment: dev
    permissions:
      contents: read
    steps:
      # The `build` job uploads `dist` only, so the api/ Function source must come from the repo.
      # Check out BEFORE downloading the artifact: actions/checkout runs `git clean -ffdx`, which
      # would delete the untracked dist/ folder if it were already there.
      - name: Check out the api/ Function source
        uses: actions/checkout@v4
        with:
          sparse-checkout: api
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
      - name: Sanity check the downloaded artifact
        run: |
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
      # Use the same Azure/static-web-apps-deploy upload as deploy_preview, NOT the SWA CLI: the CLI path
      # (`swa deploy --api-location`) never builds or reports the api/ Function, so a green dev deploy did
      # not mean a working /api/* (measured 2026-11-15: run 43683674499's re-run deployed green, yet
      # /api/shopShell and /shops/mapasta returned 404 at 06:30Z). This action logs the Oryx Function build.
      # No repo_token: this is a push to main, there is no PR to comment on.
      - name: Deploy the prebuilt output to the dev environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          api_location: 'api'
          output_location: ''
          skip_app_build: true
      - name: Verify the dev site really serves the shop shell (a green deploy is not proof)
        # /shops/* is rewritten to the shopShell Function. If it falls back to its minimal "Shop unavailable"
        # page (no /assets/), every shop URL is broken while the deploy is green — fail the job instead.
        env:
          ORIGIN: ${{ vars.DEV_SITE_ORIGIN || 'https://salmon-mushroom-015326603.2.azurestaticapps.net' }}
        run: |
          set -u
          attempts=10
          for i in $(seq 1 "$attempts"); do
            api_status=$(curl -sS -o /dev/null -w '%{http_code}' "$ORIGIN/api/shopShell?slug=mapasta" || true)
            shop_body=$(curl -sS "$ORIGIN/shops/mapasta" || true)
            if [ "$api_status" = "200" ] && printf '%s' "$shop_body" | grep -q '/assets/'; then
              echo "OK (attempt $i): /api/shopShell -> 200 and /shops/mapasta serves the SPA shell."
              exit 0
            fi
            echo "Attempt $i/$attempts: /api/shopShell -> $api_status; /shops/mapasta has no /assets/ yet."
            if [ "$i" -lt "$attempts" ]; then sleep 15; fi
          done
          echo "::error::$ORIGIN/shops/mapasta does not serve the SPA shell (api status $api_status)."
          echo "----- /shops/mapasta response body -----"
          printf '%s\n' "$shop_body"
          echo "----- /api/shopShell?slug=mapasta response body -----"
          curl -sS "$ORIGIN/api/shopShell?slug=mapasta" || true
          exit 1

  deploy_preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Deploy preview environment
    permissions:
      contents: read
      pull-requests: write
    steps:
      # api_location: 'api' needs the repo, not just the dist artifact (see deploy_dev).
      - name: Check out the api/ Function source
        uses: actions/checkout@v4
        with:
          sparse-checkout: api
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
      - name: Deploy the prebuilt output
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          app_location: 'dist'
          api_location: 'api'
          output_location: ''
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
